name: Mirror to Codeberg

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Codeberg
        run: git config user.name "AI Commons Mirror Bot" && git config user.email "mirror@eaarthnet.github" && git remote add codeberg "https://oauth2:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/eaarthnet/the-ai-commons-mc.git" && git push codeberg main --force

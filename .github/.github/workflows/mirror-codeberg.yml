name: Mirror to Codeberg

on:
  push:
    branches:
      - main

jobs:
  mirror-to-codeberg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pull full history so Codeberg mirrors cleanly

      - name: Configure git identity
        run: |
          git config user.name "AI Commons Mirror Bot"
          git config user.email "mirror@eaarthnet.github"

      - name: Set up Codeberg remote
        run: |
          git remote add codeberg https://codeberg.org/eaarthnet/the-ai-commons-mc.git

      - name: Push to Codeberg
        env:
          CODEBERG_USERNAME: "oauth2"
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git push codeberg main --force

      - name: Verify mirror
        run: |
          git fetch codeberg main
          GH_SHA=$(git rev-parse main)
          CB_SHA=$(git rev-parse codeberg/main)
          echo "GitHub:  $GH_SHA"
          echo "Codeberg: $CB_SHA"
          if [ "$GH_SHA" != "$CB_SHA" ]; then
            echo "MIRROR DIVERGED — flag for review"
            exit 1
          else
            echo "Mirror in sync"
          fi
